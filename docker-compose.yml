services:
  proton-mcp:
    build: .
    restart: unless-stopped
    # Dokploy enruta por Traefik: no publiques puertos, añade el dominio en la pestaña Domains (puerto 3000).
    expose:
      - "3000"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?define ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?define ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY (>=32 chars)}
      PUBLIC_URL: ${PUBLIC_URL:?define PUBLIC_URL (https://tu-dominio)}
      BROWSER_IDLE_MS: ${BROWSER_IDLE_MS:-90000}
      MAX_BROWSERS: ${MAX_BROWSERS:-1}
      SYNC_INTERVAL_MIN: ${SYNC_INTERVAL_MIN:-15}
      SYNC_MAX_BODIES: ${SYNC_MAX_BODIES:-15}
      SYNC_FIRST_DELAY_S: ${SYNC_FIRST_DELAY_S:-60}
      BROWSER_LEAN: ${BROWSER_LEAN:-true}
      BROWSER_SHELL: ${BROWSER_SHELL:-true}
      # Adjuntos e imágenes (cifrados antes de subir). Vacío = se guardan en PostgreSQL. Compatible con MinIO, R2, B2, AWS…
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      MAX_ATTACHMENT_MB: ${MAX_ATTACHMENT_MB:-10}
      LOAD_REMOTE_CONTENT: ${LOAD_REMOTE_CONTENT:-true}
      DATABASE_URL: postgres://proton:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@postgres:5432/proton
    volumes:
      - proton-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: "256mb" # Chromium usa --disable-dev-shm-usage; 1 GB ya no hace falta
    init: true
    # Podman construye en formato OCI y descarta el HEALTHCHECK del Dockerfile: se declara aquí para que funcione en ambos
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Almacén de correos (equivalente al SQLite de OpenWA). Sin puertos publicados: solo accesible desde proton-mcp.
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    # Ajuste para VPS pequeño (~25-40 MB en reposo en vez de los valores por defecto)
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=10", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB", "-c", "effective_cache_size=64MB", "-c", "wal_buffers=1MB", "-c", "max_wal_size=128MB", "-c", "autovacuum_max_workers=1"]
    environment:
      POSTGRES_USER: proton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: proton
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proton -d proton"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 propio y ligero (MinIO sobre Alpine) para adjuntos e imágenes. Opcional: actívalo con COMPOSE_PROFILES=s3 y define en .env
  #   S3_ENDPOINT=http://minio:9000  S3_BUCKET=proton-mcp  S3_ACCESS_KEY=<usuario>  S3_SECRET_KEY=<clave de 8+ caracteres>
  # Sin esto, los archivos se guardan (cifrados) en PostgreSQL. Sin puertos publicados: solo accesible desde proton-mcp.
  minio:
    profiles: ["s3"]
    build: ./minio
    restart: unless-stopped
    environment:
      # sin `:?` a propósito: compose interpola también los servicios con perfil desactivado; el entrypoint exige ambas
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-proton-mcp}
      MINIO_BROWSER: "off" # sin consola web: menos RAM y menos superficie
      GOMEMLIMIT: 128MiB
    volumes:
      - minio-data:/data

volumes:
  minio-data:
  proton-data:
  pg-data:
